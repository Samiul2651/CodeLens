[project]
name = "codelens"
version = "0.1.0"
description = "Ask questions about a codebase with RAG, and measure RAG vs. long-context LLMs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependencies are added in the phase that needs them (PLAN.md section 7).
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
    # Phase 1: ingestion
    "httpx>=0.27",
    "pathspec>=0.12",
    "qdrant-client>=1.12",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.9",
]

[project.scripts]
codelens = "codelens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    # In-memory Qdrant (tests) ignores payload indexes; the server uses them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, naming
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**" = ["ALL"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["pathspec.*", "tree_sitter_language_pack.*"]
ignore_missing_imports = true
