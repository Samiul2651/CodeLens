# Local services for CodeLens. Start: `docker compose up -d`
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"   # REST API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      # Docker-managed volume: Windows folder mounts break Qdrant's file renames.
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.14
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # To use the NVIDIA GPU (RTX 3050), uncomment. Needs Docker Desktop with WSL2 GPU support.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  qdrant_data:
  ollama_models:
